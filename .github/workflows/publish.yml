name: Publish images

# Build the backend + frontend images and push them to GHCR. The home-server
# real-estate-viewer stack pulls these; it never builds.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: images are built and pushed only after the full test suite passes.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Two images x two architectures, each on a native runner. QEMU emulation is
  # not an option here (it crashes on `npm ci`), so amd64 and arm64 are built
  # on hardware that matches them and stitched into one manifest list by
  # `merge` below. amd64 is what the Linux home server runs; arm64 keeps an
  # Apple Silicon Mac working as a deployment target.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: .
            dockerfile: Dockerfile.backend
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
        platform: [linux/amd64, linux/arm64]
        # `include` here only augments the existing image x platform combos
        # with the right runner - it must not introduce new keys as its own
        # dimension, or it would append standalone jobs instead of pairing.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Derive a filename-safe platform tag
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/real-estate-viewer-${{ matrix.image.name }}

      # Pushed by digest only - no tag. Tags are applied once, by `merge`, so a
      # half-finished matrix can never leave :latest on a single-arch image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/real-estate-viewer-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One merge per image: collect that image's per-arch digests into a single
  # multi-arch manifest list and apply the real tags to it.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/real-estate-viewer-${{ matrix.name }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify both architectures are present
        run: |
          ref="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref" --raw \
            | jq -e '[.manifests[].platform.architecture]
                     | (index("amd64") != null) and (index("arm64") != null)' > /dev/null \
            || { echo "::error::manifest list for $ref is missing amd64 or arm64"; exit 1; }
          docker buildx imagetools inspect "$ref"

  # Open a deploy PR in home-server for this commit's new images.
  # Runs only on the default branch, after the last manifest is published.
  trigger-deploy:
    needs: merge
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create deploy trigger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPLOY_TRIGGER_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_TRIGGER_PRIVATE_KEY }}
          owner: rudehn
          repositories: home-server

      - name: Trigger the home-server deploy PR workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run deploy-pr.yml -R rudehn/home-server --ref main \
            -f stack=real-estate-viewer \
            -f run_url="$RUN_URL"
